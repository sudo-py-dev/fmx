# Checks code changes on pushes and pull requests before a release is tagged.
# Root documentation and README screenshots do not need these checks.
# Runs formatting, lints and tests on Linux, plus Windows startup and shell tests.
name: Check

on:
  push:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'assets/screenshot*.png'
  pull_request:
    paths-ignore:
      - '*.md'
      - 'assets/screenshot*.png'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Smoke test (opens and draws; right-click menu)
        shell: pwsh
        timeout-minutes: 5
        run: packaging/windows/smoke-test.ps1 target/release/fmx.exe

  macos:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
