[package]
name = "fmx"
version = "0.4.4"
edition = "2024"
rust-version = "1.89"
description = "Free Media Xpress (FMX) - A lightweight, fast all-in-one media, document and disc converter with a clean GUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sudo-py-dev/fmx"
homepage = "https://github.com/sudo-py-dev/fmx"

[dependencies]
calamine = "0.37.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "7"
# Old FB2 books are often windows-1251; already built in through calamine.
encoding_rs = "0.8"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "links",
    "persistence",
    "wayland",
    "x11",
] }
epaint_default_fonts = "0.37"
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = [
    "bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
minisign-verify = "0.3.0"
quick-xml = "0.42"
rayon = "1.12.0"
rfd = "0.17"
rust_xlsxwriter = "0.101.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "ansi", "env-filter", "fmt", "registry", "std", "tracing-log",
] }
ttf-parser = "0.25"
ureq = "3"
# GNOME-style (Adwaita) title bar with a title and real close/minimize/maximize
# buttons on Wayland; without it winit draws a bare fallback frame.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
# Optimize shipped code for size; keep thin LTO for reasonable link times.
opt-level = "z"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# The desktop's light/dark preference (src/theme.rs) and Wayland screen
# capture through the desktop portal (src/screencast.rs).
[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1", default-features = false, features = ["process", "std"] }
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# The completion sound plays in-process on Windows and macOS. Linux uses the
# system's player instead, so building needs no ALSA headers (src/sound.rs).
[target.'cfg(not(target_os = "linux"))'.dependencies]
rodio = { version = "0.23", default-features = false, features = [
    "playback", "flac", "mp3", "mp4", "vorbis", "wav",
] }

# Windows renders with Direct3D/Vulkan through wgpu: OpenGL is often missing there.
[target."cfg(windows)".dependencies]
eframe = { version = "0.37", default-features = false, features = ["wgpu"] }
# The right-click menu's registry keys (src/shell.rs).
winreg = "0.56"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"



# epaint with right-to-left (bidi) text support; see vendor/epaint/FMX-PATCH.md.
[patch.crates-io]
epaint = { path = "vendor/epaint" }
