[package]
name = "muxr"
version = "0.0.3"
edition = "2024"
rust-version = "1.88"
description = "A lightweight, fast all-in-one media, document and disc converter with a clean GUI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sudo-py-dev/muxr"
homepage = "https://github.com/sudo-py-dev/muxr"

[dependencies]
calamine = "0.37.0"
dirs = "6"
eframe = { version = "0.37", default-features = false, features = [
    "accesskit",
    "clipboard",
    "default_fonts",
    "glow",
    "persistence",
    "wayland",
    "x11",
] }
epaint_default_fonts = "0.37"
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = [
    "bmp", "gif", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
minisign-verify = "0.3.0"
quick-xml = "0.42"
rayon = "1.12.0"
rfd = "0.17"
rust_xlsxwriter = "0.96.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = { version = "0.4.46", default-features = false }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "ansi"] }
ttf-parser = "0.25"
ureq = "3"
# GNOME-style (Adwaita) title bar with a title and real close/minimize/maximize
# buttons on Wayland; without it winit draws a bare fallback frame.
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

# Debian package (built with `cargo deb`); the version comes from [package].
[package.metadata.deb]
maintainer = "sudo-py-dev"
copyright = "sudo-py-dev"
revision = ""
section = "video"
priority = "optional"
depends = "$auto"
suggests = "ffmpeg, poppler-utils, ghostscript, xorriso, calibre"
extended-description = """\
Muxr converts video, audio, images, documents and discs from one simple \
window. It finds or downloads its own ffmpeg and yt-dlp, so nothing else \
has to be installed."""
assets = [
    ["target/release/muxr", "usr/bin/", "755"],
    ["packaging/linux/muxr.desktop", "usr/share/applications/", "644"],
    ["packaging/icons/muxr-16.png", "usr/share/icons/hicolor/16x16/apps/muxr.png", "644"],
    ["packaging/icons/muxr-24.png", "usr/share/icons/hicolor/24x24/apps/muxr.png", "644"],
    ["packaging/icons/muxr-32.png", "usr/share/icons/hicolor/32x32/apps/muxr.png", "644"],
    ["packaging/icons/muxr-48.png", "usr/share/icons/hicolor/48x48/apps/muxr.png", "644"],
    ["packaging/icons/muxr-64.png", "usr/share/icons/hicolor/64x64/apps/muxr.png", "644"],
    ["packaging/icons/muxr-128.png", "usr/share/icons/hicolor/128x128/apps/muxr.png", "644"],
    ["packaging/icons/muxr-256.png", "usr/share/icons/hicolor/256x256/apps/muxr.png", "644"],
    ["packaging/icons/muxr-512.png", "usr/share/icons/hicolor/512x512/apps/muxr.png", "644"],
]
