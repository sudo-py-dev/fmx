name: fmx
base: core24
adopt-info: fmx # version comes from Cargo.toml
summary: All-in-one media, document and disc converter
description: |
  fmx converts video, audio, images, documents and discs from one simple
  window with a clean, responsive GUI.

grade: stable
confinement: strict
icon: packaging/icons/fmx-512.png

apps:
  fmx:
    command: bin/fmx
    desktop: usr/share/applications/fmx.desktop
    extensions: [gnome]
    plugs:
      - home
      - removable-media     # Read/write files on USB drives / external media
      - optical-drive       # Rip/read optical CD/DVD drives (xorriso / disc.rs)
      - network             # video downloader (bundled yt-dlp) and update checks
      - network-bind
      - audio-playback      # Audio preview

parts:
  fmx:
    plugin: nil
    source: .
    build-packages:
      - curl
      - build-essential
      - pkg-config
      - python3
    override-build: |
      # Install the required Rust toolchain (Rust >= 1.88 per Cargo.toml)
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
      . "$HOME/.cargo/env"

      cargo build --release --locked
      craftctl set version="$(cargo metadata --no-deps --format-version 1 \
        | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"

      # Install binary with its bundled tools in bin/tools beside it
      install -Dm755 target/release/fmx "$CRAFT_PART_INSTALL/bin/fmx"
      python3 packaging/fetch-bundled.py "$CRAFT_PART_INSTALL/bin/tools" linux64
      install -Dm644 packaging/THIRD-PARTY-NOTICES.md \
        "$CRAFT_PART_INSTALL/usr/share/doc/fmx/THIRD-PARTY-NOTICES.md"

      # Install desktop file & icons
      install -Dm644 packaging/linux/fmx.desktop "$CRAFT_PART_INSTALL/usr/share/applications/fmx.desktop"
      for size in 16 24 32 48 64 128 256 512; do
        install -Dm644 "packaging/icons/fmx-$size.png" \
          "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/${size}x${size}/apps/fmx.png"
      done

    stage-packages:
      - poppler-utils
      - ghostscript
      - xorriso
